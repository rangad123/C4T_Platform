name: API CI

on:
  push:
    branches: [main, develop]
    paths: ['api/**', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api-ci.yml']
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Build
        run: npm run build

      - name: Verify RS256 token layer
        # Needs a key pair but no database. Generate a throwaway one.
        run: |
          npx tsx scripts/generate-keys.ts | grep '^JWT_' > .env.ci
          set -a && . ./.env.ci && set +a
          npm run auth:verify
        env:
          NODE_ENV: test
          API_PUBLIC_URL: http://localhost:4000
          WEB_PUBLIC_URL: http://localhost:3000
          # Never connected to — this job only typechecks, lints and builds.
          # Both are required because env validation runs at import time.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          # Throwaway — never used to encrypt anything real. Just needs to be
          # valid base64 decoding to exactly 32 bytes, which env.ts requires.
          PAYMENT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Runs only when a test database is configured. Add these repository
    # secrets pointing at a Neon branch reserved for CI:
    #
    #   TEST_DATABASE_URL         pooled endpoint  (…-pooler…?sslmode=require)
    #   TEST_DIRECT_DATABASE_URL  direct endpoint  (no -pooler)
    #
    # The branch name or database must contain "test" — tests/setup.ts refuses
    # to truncate anything else.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository != '' }}

    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.TEST_DIRECT_DATABASE_URL }}
      API_PUBLIC_URL: http://localhost:4000
      WEB_PUBLIC_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      STORAGE_DRIVER: local
      MAIL_DRIVER: console
      LOG_LEVEL: silent
      RATE_LIMIT_MAX: '1000000'
      AUTH_RATE_LIMIT_MAX: '1000000'

    steps:
      - uses: actions/checkout@v4

      - name: Check the test database is configured
        id: guard
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::warning::TEST_DATABASE_URL is not set — skipping integration tests."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
        if: steps.guard.outputs.configured == 'true'

      - name: Generate a throwaway key pair
        if: steps.guard.outputs.configured == 'true'
        run: npx tsx scripts/generate-keys.ts | grep '^JWT_' >> "$GITHUB_ENV"

      - name: Apply migrations
        if: steps.guard.outputs.configured == 'true'
        run: npx prisma migrate deploy

      - name: Run tests
        if: steps.guard.outputs.configured == 'true'
        run: npm test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage/
          retention-days: 7
          if-no-files-found: ignore
