name: Deploy API

# Fires once "API CI" finishes on main, not on every push directly — a push
# that fails lint/typecheck/build should never reach the EC2 box. See
# `workflow_dispatch` below for a manual redeploy with no code change (e.g.
# after fixing something by hand on the box and wanting a clean re-sync).
on:
  workflow_run:
    workflows: [API CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Shared with web-deploy.yml on purpose: both SSH into the same EC2
  # checkout, and only one `git reset --hard` against it may run at a time.
  group: c4t-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/c4t
            # Discard files the box regenerates itself before deploy-pull.sh
            # checks for a dirty tree. `next build` rewrites next-env.d.ts
            # with different contents from the ones `next dev` writes, so the
            # previous deploy's own build left the tree dirty and blocked the
            # next one.
            #
            # It lives here as well as in deploy-pull.sh because the copy on
            # the box is whatever the last SUCCESSFUL deploy left behind — so
            # a fix to that script cannot land while that script is what is
            # blocking the deploy. This block always runs at its newest.
            git checkout -- web/next-env.d.ts 2>/dev/null || true
            bash scripts/deploy-pull.sh
            bash api/scripts/deploy.sh
