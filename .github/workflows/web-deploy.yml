name: Deploy Web

# Fires once "Web CI" finishes on main — see api-deploy.yml's comment for why
# this isn't a plain `on: push`.
on:
  workflow_run:
    workflows: [Web CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Shared with api-deploy.yml on purpose — see that file's comment.
  group: c4t-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/c4t
            # Discard files the box regenerates itself before deploy-pull.sh
            # checks for a dirty tree. `next build` rewrites next-env.d.ts
            # with different contents from the ones `next dev` writes, so the
            # previous deploy's own build left the tree dirty and blocked the
            # next one.
            #
            # It lives here as well as in deploy-pull.sh because the copy on
            # the box is whatever the last SUCCESSFUL deploy left behind — so
            # a fix to that script cannot land while that script is what is
            # blocking the deploy. This block always runs at its newest.
            # Restores it when tracked-and-modified; deletes it when untracked
            # (which it becomes once the ignore rule lands). Either way the
            # build regenerates it straight afterwards.
            git checkout -- web/next-env.d.ts 2>/dev/null || rm -f web/next-env.d.ts
            bash scripts/deploy-pull.sh
            bash web/scripts/deploy.sh
