name: Deploy AI Studio

# Fires once "AI Studio CI" finishes on main, like web-deploy.yml. Run it by
# hand after a DNS change, and with enable_shared_sign_in to share the sign-in.
# See AI_Studio/deploy/c4t-box/README.md.
#
# The runner downloads (the runner program, the complete downloads with their
# own Node.js and packages, and the installers) are built here, not on the box:
# the box is small and shared with crowd4test.com. The finished files are copied
# over with the same SSH secrets, and deploy.sh puts them in place.
#
# Signing (docs/features/runner-updates.md, runner-installer.md): each step runs
# only when its secrets are set, and says so in the log when they are not.
#   RUNNER_UPDATE_SIGNING_KEY  signs the runner update (Ed25519). Without it no
#                              runner is offered an update; people download new
#                              versions by hand. Signed in its own job, which
#                              installs no npm package next to the key.
#   WIN_CERT_PFX (base64), WIN_CERT_PASSWORD
#                              Authenticode for AITestingRunnerSetup.exe.
#   APPLE_CERT_P12 (base64), APPLE_CERT_PASSWORD, APPLE_DEVELOPER_ID_APPLICATION,
#   APPLE_DEVELOPER_ID_INSTALLER, APPLE_TEAM_ID, APPLE_ID, APPLE_APP_PASSWORD
#                              Developer ID signing and notarisation of the Mac
#                              package (built here, not served yet).
on:
  workflow_run:
    workflows: [AI Studio CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_shared_sign_in:
        description: Update the production web and API env files and restart them. Needs the site live over HTTPS.
        type: boolean
        default: false

# Read-only token: the build jobs run npm install scripts, and nothing here pushes.
permissions:
  contents: read

jobs:
  installer-windows:
    name: Build the Windows installer
    # csc.exe, the C# compiler that comes with Windows, builds it (scripts/build-installer-win.mjs).
    runs-on: windows-latest
    timeout-minutes: 15
    # A run by hand builds the downloads only from main, which is what the box deploys (deploy-pull.sh).
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    defaults:
      run:
        working-directory: AI_Studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Only Node's own modules are needed: no npm ci here.
      - name: Compile the installer
        run: node scripts/build-installer.mjs --skip-mac
      - name: Check that it was built
        shell: bash
        run: test -s dist/installer/win/AITestingRunnerSetup.exe
      # Authenticode, only with a certificate. Without one the program goes out unsigned and Windows says "unknown publisher".
      - name: Sign the Windows program (Authenticode)
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if (-not $env:WIN_CERT_PFX) { Write-Output "WIN_CERT_PFX is not set, so the Windows program goes out unsigned (Windows shows it as from an unknown publisher)."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "runner-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe was not found on this machine." }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WIN_CERT_PASSWORD dist/installer/win/AITestingRunnerSetup.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool could not sign the program." }
            & $signtool.FullName verify /pa dist/installer/win/AITestingRunnerSetup.exe
            if ($LASTEXITCODE -ne 0) { throw "The signature does not verify." }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: runner-installer-windows
          path: AI_Studio/dist/installer/win/AITestingRunnerSetup.exe
          retention-days: 1
          if-no-files-found: error

  runner-downloads:
    name: Build the runner downloads
    needs: installer-windows
    # Still built when the Windows installer failed: the downloads then carry
    # Node.js and the packages without the installer program.
    # A run by hand builds the downloads only from main, which is what the box deploys (deploy-pull.sh).
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AI_Studio
    env:
      # Windows and Mac on both processors, and Linux on Intel or AMD. About 60 MB each.
      RUNNER_TARGETS: win-x64,win-arm64,mac-arm64,mac-x64,linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AI_Studio/package-lock.json
      # The complete downloads copy these packages, so they are exactly the lock file's versions.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Fetch the Windows installer
        if: ${{ needs.installer-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: runner-installer-windows
          path: AI_Studio/dist/installer-win
      - name: Build the runner, its complete downloads and the installers
        run: |
          npm run build:runner -- --complete --targets "$RUNNER_TARGETS"
          if [ -s dist/installer-win/AITestingRunnerSetup.exe ]; then
            node scripts/build-installer.mjs --windows-exe dist/installer-win/AITestingRunnerSetup.exe
          else
            echo "::warning::The Windows installer was not built; the Windows downloads go out without it."
            node scripts/build-installer.mjs --skip-windows
          fi
          COMMIT="$(git rev-parse HEAD)" node -e 'const fs = require("node:fs"); fs.writeFileSync("dist/build-info.json", JSON.stringify({ commit: process.env.COMMIT, builtAt: new Date().toISOString(), targets: process.env.RUNNER_TARGETS.split(",") }, null, 2) + "\n")'
      - name: Check every download before it leaves
        run: |
          test -s dist/runner/manifest.json
          for t in ${RUNNER_TARGETS//,/ }; do
            test -s "dist/runner-complete/$t/manifest.json" && test -s "dist/runner-complete/$t/pack.bin" || { echo "::error::The complete download for $t is missing."; exit 1; }
          done
          test -s dist/installer/manifest.json
          tar -cf runner-downloads.tar -C dist runner runner-complete installer build-info.json
          sha256sum runner-downloads.tar >runner-downloads.tar.sha256
          du -h runner-downloads.tar
      - uses: actions/upload-artifact@v4
        with:
          name: runner-downloads
          path: |
            AI_Studio/runner-downloads.tar
            AI_Studio/runner-downloads.tar.sha256
          retention-days: 1
          # The packs inside are compressed already.
          compression-level: 0
          if-no-files-found: error

  # The update manifest is signed here, in a job that installs no npm package: no package's install script ever runs next to the key.
  # The job hashes every file again (scripts/sign-runner-update.mjs, Node's own modules only) and replaces the downloads artifact with
  # the signed copy. Without the secret it changes nothing and says so: the platform then offers no runner update.
  sign-runner-update:
    name: Sign the runner update
    needs: runner-downloads
    if: ${{ !cancelled() && needs.runner-downloads.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          sparse-checkout: AI_Studio/scripts/sign-runner-update.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: runner-downloads
          path: incoming
      - name: Sign the update manifest
        id: sign
        env:
          RUNNER_UPDATE_SIGNING_KEY: ${{ secrets.RUNNER_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RUNNER_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::RUNNER_UPDATE_SIGNING_KEY is not set, so this deploy publishes no runner update. Installed runners keep their version, and the Runners page tells people to download the new one."
            exit 0
          fi
          (cd incoming && sha256sum -c --quiet runner-downloads.tar.sha256)
          mkdir work
          tar -xf incoming/runner-downloads.tar -C work
          node AI_Studio/scripts/sign-runner-update.mjs --kit work/runner --complete work/runner-complete
          tar -cf incoming/runner-downloads.tar -C work runner runner-complete installer build-info.json
          (cd incoming && sha256sum runner-downloads.tar >runner-downloads.tar.sha256)
          echo "signed=true" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ steps.sign.outputs.signed == 'true' }}
        with:
          name: runner-downloads
          overwrite: true
          path: |
            incoming/runner-downloads.tar
            incoming/runner-downloads.tar.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # The Mac package (.pkg) and disk image, signed with Developer ID and notarised when the Apple secrets are set. Built and kept as an
  # artifact only: the platform keeps serving the zip until a pass on a real Mac is green.
  installer-mac-package:
    name: Build the Mac package
    runs-on: macos-15
    timeout-minutes: 30
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    defaults:
      run:
        working-directory: AI_Studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Only Node's own modules are needed: no npm ci here.
      - name: Build the Mac app
        run: node scripts/build-installer.mjs --skip-windows
      - name: Build, sign and notarise the package
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          out=dist/installer-pkg
          if [ -z "$APPLE_CERT_P12" ] || [ -z "$APPLE_DEVELOPER_ID_APPLICATION" ] || [ -z "$APPLE_DEVELOPER_ID_INSTALLER" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::notice::The Apple signing secrets are not set, so the Mac package is built unsigned (Gatekeeper will ask before it opens)."
            sh scripts/build-runner-pkg.sh --out "$out"
          else
            keychain="$RUNNER_TEMP/runner-signing.keychain-db"
            kpass="$(uuidgen)"
            security create-keychain -p "$kpass" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$kpass" "$keychain"
            printf '%s' "$APPLE_CERT_P12" | base64 --decode >"$RUNNER_TEMP/runner-signing.p12"
            security import "$RUNNER_TEMP/runner-signing.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/runner-signing.p12"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            sh scripts/build-runner-pkg.sh --out "$out" --sign-app "$APPLE_DEVELOPER_ID_APPLICATION"
            for pkg in "$out"/*.pkg; do
              productsign --sign "$APPLE_DEVELOPER_ID_INSTALLER" --keychain "$keychain" "$pkg" "$pkg.signed" && mv -f "$pkg.signed" "$pkg"
              xcrun notarytool submit "$pkg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
              xcrun stapler staple "$pkg"
            done
            security delete-keychain "$keychain"
          fi
          sh scripts/make-dmg.sh --out "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: runner-installer-mac-pkg
          path: AI_Studio/dist/installer-pkg/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    needs: [runner-downloads, sign-runner-update]
    runs-on: ubuntu-24.04
    # The first deploy downloads Node and Chromium on a small box at low priority.
    timeout-minutes: 45
    # Deploys even when the runner downloads could not be built: the box then keeps the ones it has.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    concurrency:
      # Shared with api-deploy.yml and web-deploy.yml on purpose: all three SSH into
      # the same EC2 checkout, and only one `git reset --hard` may run at a time.
      # On this job, not the workflow, so the builds above do not hold the queue.
      group: c4t-ec2-deploy
      cancel-in-progress: false
    steps:
      # Neither this step nor the copy may stop the deploy: the box then keeps the downloads it has.
      - name: Fetch the runner downloads
        if: ${{ needs.runner-downloads.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: runner-downloads
          path: incoming
      # Into ~/.ai-studio/incoming, outside the checkout. deploy.sh checks the
      # SHA-256 and the room on the disk before it swaps them in.
      - name: Copy the runner downloads to the box
        if: ${{ needs.runner-downloads.result == 'success' }}
        continue-on-error: true
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          key=~/.ssh/c4t_deploy
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" >"$key"
          opts=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30)
          size_mb=$(( $(stat -c %s incoming/runner-downloads.tar) / 1048576 + 1 ))
          free_mb="$(ssh "${opts[@]}" "$EC2_USER@$EC2_HOST" 'umask 077 && mkdir -p "$HOME/.ai-studio/incoming" && rm -f "$HOME/.ai-studio/incoming/runner-downloads.tar" "$HOME/.ai-studio/incoming/runner-downloads.tar.sha256" && df -Pm "$HOME/.ai-studio" | awk "NR == 2 { print \$4 }"')"
          # The upload, its unpacked copy, and the 2500 MB the deploy itself needs.
          need_mb=$(( size_mb * 2 + 2500 ))
          if ! [[ "$free_mb" =~ ^[0-9]+$ ]]; then
            echo "::warning::The free disk on the box could not be read, so the runner downloads were not copied. The box keeps the ones it has."
            exit 0
          fi
          if [ "$free_mb" -lt "$need_mb" ]; then
            echo "::warning::Only $free_mb MB are free on the box and the runner downloads need $need_mb MB, so they were not copied. The box keeps the ones it has."
            exit 0
          fi
          # The checksum goes last: deploy.sh trusts a file only when both are there and they match.
          scp "${opts[@]}" incoming/runner-downloads.tar "$EC2_USER@$EC2_HOST:.ai-studio/incoming/runner-downloads.tar"
          scp "${opts[@]}" incoming/runner-downloads.tar.sha256 "$EC2_USER@$EC2_HOST:.ai-studio/incoming/runner-downloads.tar.sha256"
          echo "Copied $size_mb MB of runner downloads."
      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          AI_STUDIO_SECRET_KEY: ${{ secrets.AI_STUDIO_SECRET_KEY }}
          AI_STUDIO_API_KEY: ${{ secrets.AI_STUDIO_API_KEY }}
          AI_STUDIO_SERVICE_TOKEN: ${{ secrets.AI_STUDIO_SERVICE_TOKEN }}
          ENABLE_SHARED_SIGN_IN: ${{ inputs.enable_shared_sign_in && 'true' || 'false' }}
          # The commit the CI run checked: deploy.sh starts nothing newer (empty for a run by hand, which deploys main).
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AI_STUDIO_SECRET_KEY,AI_STUDIO_API_KEY,AI_STUDIO_SERVICE_TOKEN,ENABLE_SHARED_SIGN_IN,TESTED_SHA
          # The action stops a command after 10 minutes unless told otherwise.
          command_timeout: 40m
          script_stop: true
          script: |
            cd /var/www/c4t
            # The same clean-up as web-deploy.yml and api-deploy.yml: a web
            # build leaves these two rewritten, and deploy-pull.sh refuses a
            # dirty tree. See web-deploy.yml for why it lives here as well.
            git checkout -- web/next-env.d.ts 2>/dev/null || rm -f web/next-env.d.ts
            git checkout -- web/tsconfig.json 2>/dev/null || true
            bash scripts/deploy-pull.sh
            bash AI_Studio/deploy/c4t-box/deploy.sh
