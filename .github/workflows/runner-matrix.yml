# The runner on real machines: GitHub's hosted Windows, macOS and Linux computers each build the runner download, sign up a person on a
# platform started in the same job, download that person's runner the way Settings does (one download per system: the installer on
# Windows and a Mac, the plain files on Linux; the Mac and Linux ones with their own Node.js because the complete build is made below,
# while the Windows installer installs the test tools itself), install it with the real
# installer without questions, check that it connects, run a web test and an API test on it end to end, stop it, start it again, remove
# the computer, uninstall it and check that nothing is left (AI_Studio/scripts/smoke-runner.mjs --kit installer --lifecycle). The same
# download started with its start script, and with no Node.js on the PATH (its own Node.js), is checked too (on Linux; Windows and a Mac
# skip them plainly, their installer download has no start script). Each download is one thing (rounds 49 and 50) and is used as people
# get it: Windows starts AITestingRunnerSetup.exe, a Mac's ai-testing-runner-mac.pkg (round 55) is read back into the app with its kit
# for the smoke check and, in its own step, installed by macOS's Installer (`installer -pkg ... -target CurrentUserHomeDirectory`, no
# sudo, scripts/smoke-mac-pkg.mjs), Linux runs `sh ai-testing-runner.sh`. On a Mac and on Linux a second download is then started while the runner runs:
# the earlier runner must stop and the new one come online. Each machine then explores the sample app on its runner (round 51,
# --explore): the platform's AI is a scripted model double served by the smoke script (no AI provider, no key), and the check is that
# the exploration ran on the runner, made tests, and that the platform opened no browser itself (AI_Studio/docs/features/explore-on-runner.md).
# What this proves and what it cannot: AI_Studio/docs/features/real-machine-checks.md.
#
# GitHub's Windows machines run Windows Server 2022 and 2025, not Windows 10 or 11 desktop, and nobody is signed in at a screen: a manual
# pass on a real Windows 11 PC and a real Mac is still needed (AI_Studio/docs/runner-implementation/MANUAL_VERIFICATION.md).
# No secret is used and nothing is deployed.
name: Runner on real machines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AI_Studio/src/agent/**"
      - "AI_Studio/src/agent-protocol/**"
      - "AI_Studio/installer/**"
      - "AI_Studio/scripts/build-runner*"
      - "AI_Studio/scripts/build-installer*"
      - "AI_Studio/scripts/smoke-runner.mjs"
      - "AI_Studio/scripts/smoke-mac-pkg.mjs"
      - "AI_Studio/scripts/mac-pkg-read.mjs"
      # What the server makes of a download (round 50: the Linux script; round 55: the Mac package).
      - "AI_Studio/src/platform/runner-*.ts"
      - "AI_Studio/src/platform/routes/runner-kits.ts"
      - ".github/workflows/runner-matrix.yml"
  pull_request:
    paths:
      - "AI_Studio/src/agent/**"
      - "AI_Studio/src/agent-protocol/**"
      - "AI_Studio/installer/**"
      - "AI_Studio/scripts/build-runner*"
      - "AI_Studio/scripts/build-installer*"
      - "AI_Studio/scripts/smoke-runner.mjs"
      - "AI_Studio/scripts/smoke-mac-pkg.mjs"
      - "AI_Studio/scripts/mac-pkg-read.mjs"
      # What the server makes of a download (round 50: the Linux script; round 55: the Mac package).
      - "AI_Studio/src/platform/runner-*.ts"
      - "AI_Studio/src/platform/routes/runner-kits.ts"
      - ".github/workflows/runner-matrix.yml"

permissions:
  contents: read

concurrency:
  group: runner-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Runner, ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows Server 2022 x64
            target: win-x64
            installer: true
          - os: windows-2025
            label: Windows Server 2025 x64
            target: win-x64
            installer: true
          # macos-14 was retired by GitHub ("The configuration 'macos-14-arm64-us-default' is not supported"); macos-15 is Apple silicon.
          - os: macos-15
            label: macOS 15 Apple silicon
            target: mac-arm64
            installer: true
          # macos-13 (Intel) was retired by GitHub; macos-15-intel is the Intel image that remains.
          - os: macos-15-intel
            label: macOS 15 Intel
            target: mac-x64
            installer: true
          # Pinned: ubuntu-latest moved to Ubuntu 26.04 on 2026-11-11; 24.04 is the image this was last proven on.
          - os: ubuntu-24.04
            label: Linux x64
            target: linux-x64
            installer: false
    defaults:
      run:
        shell: bash
        working-directory: AI_Studio
    env:
      # A path that does not exist, so no test can reach a phone.
      TAQWRIGHT_HOME: /nonexistent-taqwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AI_Studio/package-lock.json
      - run: npm ci
      # Not fatal: GitHub's Ubuntu image already has these libraries, and Ubuntu's package mirrors were unreachable from GitHub's
      # machines for hours on 2026-11-11. A library that is really missing still fails the runs below, with the reason.
      - name: System libraries for the browser (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: Build the web UI
        run: npm run build:web
      - name: Build the runner
        run: npm run build:runner
      # Not fatal on purpose: when the installer cannot be built, the installer check below fails with the reason instead.
      - name: Build the installer (Windows program and Mac app)
        if: matrix.installer && runner.os == 'Windows'
        continue-on-error: true
        run: npm run build:installer
      - name: Build the installer (Mac app)
        if: matrix.installer && runner.os == 'macOS'
        continue-on-error: true
        run: npm run build:installer -- --skip-windows
      - name: Build the Mac package and disk image (unsigned)
        if: matrix.installer && runner.os == 'macOS'
        continue-on-error: true
        run: |
          sh scripts/build-runner-pkg.sh --out dist/installer-pkg
          sh scripts/make-dmg.sh --out dist/installer-pkg
      # Not on Windows: there is no complete download for Windows (its installer installs the test tools itself).
      - name: Build the complete download for ${{ matrix.target }}
        if: runner.os != 'Windows'
        run: npm run build:runner -- --complete --targets ${{ matrix.target }}
      - name: Installer, unattended, with stop, restart, uninstall
        if: matrix.installer
        run: node scripts/smoke-runner.mjs --kit installer --lifecycle --explore --port 6953 --out smoke-report/installer
      # Linux: sh ai-testing-runner.sh (round 50), then a second download replacing the running runner, and the exploration (Windows and
      # a Mac explore in the installer step above; their files run is skipped before it).
      - name: The download started with its start script
        if: success() || failure()
        run: node scripts/smoke-runner.mjs --kit files --explore --port 6950 --out smoke-report/files
      # The proof that the complete download needs nothing: the runner is started with a PATH that holds no Node.js and no npm.
      - name: Complete download with no Node.js on the PATH
        if: success() || failure()
        run: node scripts/smoke-runner.mjs --kit complete --no-node-on-path --port 6956 --out smoke-report/complete
      # Round 55: the Mac download is one installer package, written on the server without Apple's tools. Here Apple's own pkgutil
      # must read it, and Installer must install it for this user (no sudo), its postinstall set up the runner, the runner write
      # "Connected to the platform" to its own log, and a second package replace the running runner (scripts/smoke-mac-pkg.mjs).
      - name: Mac package installed with installer -pkg
        if: (success() || failure()) && matrix.installer && runner.os == 'macOS'
        timeout-minutes: 25
        run: node scripts/smoke-mac-pkg.mjs --port 6960 --out smoke-report/mac-pkg
      # The installer tests that need the real system (Windows: the C# compiler; macOS: the setup script under the Mac's own /bin/sh).
      # Informative on macOS: those tests were written to simulate a Mac elsewhere, so a failure there is read, not trusted blindly.
      - name: Installer tests on this system
        if: (success() || failure()) && matrix.installer
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npx vitest run tests/installer-win-unit.test.ts tests/runner-stop-file-unit.test.ts
          else
            npx vitest run tests/installer-mac-unit.test.ts
          fi
      # The compiled setup program really run against a platform in this job (tests/installer-win.test.ts): the unzipped-folder path and the
      # one-file download (round 49: AITestingRunnerSetup.exe with the kit appended, started alone; its installed copy has no trailer).
      - name: Windows setup program, real runs
        if: (success() || failure()) && matrix.installer && runner.os == 'Windows'
        timeout-minutes: 25
        # Only the one-file download's tests: the whole file would not fit in the job's time limit after the smoke runs.
        run: npx vitest run tests/installer-win.test.ts -t "one-file download"
      - name: Upload the report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-smoke-${{ matrix.os }}
          path: |
            AI_Studio/smoke-report/
            AI_Studio/dist/installer-pkg/
          if-no-files-found: warn
          retention-days: 14
