<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.stack{display:flex;flex-direction:column;gap:14px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Field, Input, Textarea, Select, Checkbox, Radio, Switch } = window.Crowd4TestDesignSystem_772017;
function Card(){
 const [on,setOn]=React.useState(true);
 return (<div className="grid">
  <div className="stack">
   <Field label="Work email" required htmlFor="e1"><Input id="e1" placeholder="you@company.com"/></Field>
   <Field label="Company size" htmlFor="s1"><Select id="s1" placeholder="Select one" options={["1–50","51–500","501–5,000","5,000+"]}/></Field>
   <Field label="Team" htmlFor="e2" error="Enter a valid work email address."><Input id="e2" invalid defaultValue="qa@"/></Field>
  </div>
  <div className="stack">
   <Field label="What are you testing?" htmlFor="t1" hint="A sentence is plenty."><Textarea id="t1" rows={3} placeholder="Agent-based support flow across web and iOS…"/></Field>
   <Checkbox label="Send me the quarterly QE benchmark" description="One email a quarter. Unsubscribe anytime." checked={on} onChange={()=>setOn(!on)}/>
   <Radio name="p" label="Scale" description="For teams shipping weekly" checked readOnly/>
   <Switch label="Annual billing" checked={on} onChange={()=>setOn(!on)}/>
  </div>
 </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
