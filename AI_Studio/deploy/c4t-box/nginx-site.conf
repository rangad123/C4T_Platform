# aistudio.crowd4test.com: passes everything to AI Studio on 127.0.0.1:4100.
# Installed by AI_Studio/deploy/c4t-box/deploy.sh. certbot adds the TLS lines to
# the installed copy. Edit this file, not that one: deploy.sh installs it again
# when it changes, and then has certbot add TLS again.

map $http_upgrade $ai_studio_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name aistudio.crowd4test.com;

    # Uploads are held in memory, and no phone runs on this box, so a large
    # app upload would only risk the memory crowd4test.com needs.
    client_max_body_size 100m;

    # No other site may show AI Studio in a frame (it is never embedded; the
    # security report's own frame is a sandboxed srcdoc, which this does not
    # touch), and no response is read as a type other than the one it says.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # AI Studio passes the FIRST address on to the Crowd4Test API, so it has
        # to be nginx's own view. $proxy_add_x_forwarded_for would keep whatever
        # the visitor sent first.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ai_studio_connection;

        # Live run events are server-sent events: no buffering, long timeouts.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Large uploads go straight through, not to nginx's temp folder first.
        proxy_request_buffering off;
    }
}
